name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      # Los tests del DSP son procesamiento de señal puro — sin dispositivo de
      # audio, sin tap, sin permisos — así que corren en una máquina de CI sin
      # cabeza igual que en un laptop.
      - name: Test
        run: swift test
