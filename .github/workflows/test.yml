name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      # The DSP tests are pure signal processing — no audio device, no tap, no
      # permissions — so they run on a headless CI machine exactly as they do
      # on a laptop.
      - name: Test
        run: swift test
